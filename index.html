b.style.setProperty("background-color",C[h%C.length],"important");
b.style.setProperty("color","#fff","important");
b.onclick=()=>showOnly(h);
hours.appendChild(b)}
}
function selectors(){for(let h=4;h<=30;h++){let a=document.createElement("option");a.value=h;a.textContent=String(h).padStart(2,"0")+"時";startHour.appendChild(a);let b=document.createElement("option");b.value=h;b.textContent=String(h).padStart(2,"0")+"時";endHour.appendChild(b)}startHour.value=4;endHour.value=30}
function ref(){
document.querySelectorAll(".hour").forEach(b=>{
let h=+b.textContent.slice(0,2),on=m.hasLayer(Lyr[h]);
b.style.setProperty("background-color",C[h%C.length],"important");
b.style.setProperty("color","#fff","important");
b.style.opacity=on?"1":"0.45"
})
}
function showOnly(h){Object.entries(Lyr).forEach(([k,v])=>+k===h?v.addTo(m):m.removeLayer(v));ref()}
function showRange(){let start=+startHour.value,end=+endHour.value;if(start>end){alert("開始時間は終了時間以下にしてください。");return}Object.entries(Lyr).forEach(([k,v])=>{let h=+k;(h>=start&&h<=end)?v.addTo(m):m.removeLayer(v)});ref()}
function showAll(){Object.values(Lyr).forEach(v=>v.addTo(m));ref()}
function hideAll(){Object.values(Lyr).forEach(v=>m.removeLayer(v));ref()}
btn();selectors();showAll();if(D.length)m.fitBounds(D.map(x=>[x.lat,x.lon]),{padding:[20,20]});
</script></body></html>
